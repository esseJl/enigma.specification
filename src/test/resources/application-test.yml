spring:
  datasource:
    url: jdbc:h2:mem:hr_spec_test;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  batch:
    job:
      enabled: false   # تا BatchAutoConfiguration دردسر نسازد

enigma:
  spec:
    max-filter-depth: 32
    max-sort-fields: 20
    max-filter-nodes: 1000
    max-joins: 30